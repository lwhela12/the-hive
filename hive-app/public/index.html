<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="application-name" content="HIVE" />
    <meta name="description" content="AI-powered wish coordination for your community" />
    <!-- The one theme-color in the app. It is the colour of the browser's own
         furniture — the address bar on a phone, the card in the task switcher —
         and the script at the end of this head rewrites it to HIVE-Wide's
         near-black when that is where this person is landing.

         `expo.web.themeColor` in app.json used to add a SECOND one at the bottom
         of this head, which the script cannot reach because it runs before that
         line is parsed. Two theme-colors is a coin toss dressed as a setting, so
         app.json no longer sets it and the PWA colour lives where it belongs, in
         public/manifest.json. -->
    <meta name="theme-color" content="#bd9348" />
    <meta name="background-color" content="#bd9348" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HIVE" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Open the road to the database while the app is still downloading.
         The very first thing the loaded app does is ask Supabase who is signed
         in and fetch their HIVE, and on a phone that request pays for DNS, TCP
         and TLS before a byte of data moves. This line does that handshake in
         parallel with the script download, so by the time the app asks, the
         road is already open. The address is this project's Supabase host —
         the same one lib/supabase.ts is built with. If the Supabase project
         ever moves, update this too; a preconnect to a wrong address wastes a
         handshake and breaks nothing. (2026-08-12) -->
    <link rel="preconnect" href="https://cpfvnfcjhoeowdcexppi.supabase.co" crossorigin />
    <link rel="manifest" href="/manifest.json" />
    <!-- Named with a version on purpose. A browser caches a favicon in a place
         of its own that no Cache-Control header reaches — Nat's Chrome sidebar
         was still drawing the old bee hours after the new one shipped, on a
         site that sends `no-store` on everything. A different address is the
         one thing that cache cannot ignore, so bump `?v=` whenever the icon
         changes. (2026-08-19) -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=3" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon.png?v=3" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }

      body {
        overflow: hidden;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
    </style>

    <!--
      The bee arrives before the app does.

      Nat, twice on 2026-08-06: "still a really long load time for such a simple
      app." A good part of what that felt like was a plain white browser page —
      HIVE's own gold splash lives inside the app's JavaScript, so it could not
      appear until a megabyte of script had arrived, parsed and run. On a phone
      on cellular that is several seconds of nothing.

      These few lines are HTML, so they paint on the first frame the browser
      draws, before a single byte of the app is asked for. Same bee, same flight
      as components/ui/ThinkingBee — so when the real one takes over there is
      nothing to see happening.

      ARRIVING IN ONE COLOUR (2026-08-06, second pass)

      The first version of this splash was always gold, and that bought a new
      problem for the price of the old one. Nat: "there was a flash of white, a
      flash of golden and then space. Very janky travel." HIVE has two worlds —
      cream inside a HIVE, near-black at HIVE-Wide — and everybody now lands at
      HIVE-Wide, so a fixed gold splash guaranteed a colour change on arrival for
      almost every member.

      So the splash asks where this person is going BEFORE it paints, and paints
      that. The browser already holds the answer: the script at the end of this
      head reads the same two keys lib/hiveSelection.ts writes, and the saved
      sign-in. Landing at HIVE-Wide gets near-black from the very first frame, so
      there is one colour from the first pixel to the loaded app.

      Gold stays for everyone heading into a HIVE. It is HIVE's front door, Nat
      asked for the flying bee by name, and gold to cream is a step inside one
      family rather than a cut from light to dark.

      The handover is a dissolve as well, so on the rare visit where the guess is
      wrong — somebody opening an invite, a sign-in that fails — the colour
      changes by fading rather than by flashing.

      AND IT STAYS UNTIL THERE IS A PAGE (2026-08-06, third pass)

      Nat, on her iPhone: "from the public site to the 'members only site' it was
      glitching out, flashes of different colours and quick nano flashes of the
      bee thinking."

      Recorded frame by frame, the crossing was this splash and then three more
      things taking turns: it let go the instant React put ANYTHING in #root, so
      the bee vanished for a couple of hundred milliseconds, the root layout drew
      its own bee for another four hundred, that one vanished too, and then the
      screen was empty for six hundred more while the code for the page
      downloaded — routes were split per screen on web at the time, and a screen
      that had not landed yet drew nothing at all. (The split itself was turned
      off on 2026-08-07 — every deploy renamed the pieces and stranded returning
      phones, see scripts/verify-web-export.mjs — but the one-bee rule it taught
      us stands.)

      Bee, gone, bee, gone, page. So this splash is now the ONLY loading surface
      the boot has. It waits to be told the app has drawn a real screen —
      `window.__hiveArrived()`, called from the screens themselves — and every
      loading state underneath deliberately draws no bee while it is still here
      (see components/ui/ThinkingBee.tsx). One bee, one colour, one flight.
    -->
    <style id="hive-boot">
      /* Three destinations, three colours, each the colour of the page it is
         about to become. Gold is HIVE's front door and turns into cream. The
         near-black is HIVE-Wide, the same #07080F as SPACE_SKIN.page in
         lib/pageSkin.ts. The dark brown is the sign-in screen, the same #33271a
         as app/(auth)/login.tsx. The script below picks one. */
      :root {
        --hive-boot-bg: #bd9348;
        color-scheme: light;
      }

      html[data-hive-boot='space'] {
        --hive-boot-bg: #07080f;
        /* Tells the browser to draw its own canvas, scrollbars and form
           controls dark. Without it Chrome paints the page white for the frames
           before our own background is resolved, which is the white Nat sees
           first. */
        color-scheme: dark;
      }

      html[data-hive-boot='door'] {
        --hive-boot-bg: #33271a;
        color-scheme: dark;
      }

      /* And a fourth, for once you are actually inside.
         The gold above is an ARRIVAL colour — HIVE's front door, chosen because
         it turns into cream. It never turned: `app/_layout.tsx` cleared the
         attribute when it worked out you were in a HIVE, which dropped it back
         to the gold default and left it there for the rest of the session. On a
         desktop nothing shows through and nobody noticed. On a phone the page
         stops above the home indicator and the gold paints the strip underneath
         — Nat, 2026-08-17: *"i dont think we need that amber footer below the
         nav footer, right? that might give us more room."*
         Right. It is the same colour as PathFooter's bar, so the trail along the
         bottom now runs to the edge of the glass instead of stopping short of an
         amber band. */
      html[data-hive-boot='inside'] {
        --hive-boot-bg: #f4f0e6;
        color-scheme: light;
      }

      html,
      body {
        background-color: var(--hive-boot-bg);
        /* A guess that turns out wrong changes colour by fading. The one that
           happens for real: an invite link opens on gold, the invite has
           already been used, and the app sends that person to the sign-in
           screen instead — which is dark brown. */
        transition: background-color 260ms ease;
      }

      #hive-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--hive-boot-bg);
        opacity: 1;
        /* Long enough to read as a dissolve rather than a cut. The page
           underneath is finished by the time this runs, so there is nothing to
           gain by hurrying it. */
        transition: opacity 320ms ease-out, background-color 260ms ease;
      }

      /* Leaving, not gone. It stops taking taps the instant it starts to fade,
         so the app underneath is live before the pixels finish. */
      #hive-boot-splash.hive-boot-leaving {
        opacity: 0;
        pointer-events: none;
      }

      #hive-boot-splash span {
        font-size: 22px;
        line-height: 28px;
        animation: hive-boot-flight 2.6s linear infinite;
      }

      /* A figure of eight: across on one cycle, up and down on two. */
      @keyframes hive-boot-flight {
        0%   { transform: translate(0, 0) rotate(-12deg); }
        12.5%{ transform: translate(6px, -6px) rotate(-1deg); }
        25%  { transform: translate(12px, 0) rotate(10deg); }
        37.5%{ transform: translate(6px, 6px) rotate(11deg); }
        50%  { transform: translate(0, 0) rotate(12deg); }
        62.5%{ transform: translate(-6px, -6px) rotate(1deg); }
        75%  { transform: translate(-12px, 0) rotate(-10deg); }
        87.5%{ transform: translate(-6px, 6px) rotate(-11deg); }
        100% { transform: translate(0, 0) rotate(-12deg); }
      }

      /* Somebody who asked for less movement still needs to know it is busy. */
      @media (prefers-reduced-motion: reduce) {
        #hive-boot-splash span {
          animation: none;
        }

        html,
        body,
        #hive-boot-splash {
          transition: none;
        }
      }
    </style>

    <script>
      // Where is this person going? Answered before the first pixel.
      //
      // This runs in the head, so it blocks parsing and finishes before the
      // browser paints anything at all — which is the whole point. By the time
      // there is a frame to draw, the page already knows whether it is a HIVE or
      // HIVE-Wide and is wearing that colour.
      //
      // THE RULE, and it is the same one app/_layout.tsx seeds `wholeHive` with.
      // Both places must say the same thing or the splash and the app's first
      // React frame will disagree, which is the flash all over again. If you
      // change one, change the other.
      //
      //   1. on /login or /callback   → the sign-in screen, whoever you are.
      //                                 The public site's "Member log in" lands
      //                                 here, and it stays here even for
      //                                 somebody already signed in — so this is
      //                                 known rather than guessed. Dark brown.
      //   2. `hive:wide` set          → they are standing at HIVE-Wide right now
      //                                 (a reload, or the "fresh honey" refresh)
      //   3. `hive:confirmed` set     → they picked a HIVE in this tab, so gold
      //   4. on /join                 → an invite puts you INSIDE the HIVE you
      //                                 just joined, and the join screen is
      //                                 cream, so gold
      //   5. a saved sign-in exists   → a fresh tab, and the app's own rule is
      //                                 that everybody lands at HIVE-Wide
      //   6. otherwise                → signed out, and the only page a signed
      //                                 out arrival can reach is the sign-in
      //                                 screen, which is dark brown
      //
      // Rules 1 and 6 are new on 2026-08-06. Both used to answer gold, which
      // meant every arrival at the sign-in screen — the single most common way
      // into this app, straight off the public site — was a gold screen followed
      // by a dark brown one. Gold is the colour of a HIVE, and somebody at the
      // door is not in a HIVE yet.
      //
      // The two session keys are written by lib/hiveSelection.ts. `the-hive-auth`
      // is the Supabase session — on web AsyncStorage is plain localStorage under
      // the key as written, and lib/supabase.ts names it `the-hive-auth`.
      (function () {
        function headingTo() {
          var path = window.location.pathname;
          if (path === '/login' || path === '/callback') return 'door';
          try {
            if (window.sessionStorage.getItem('hive:wide') === '1') return 'space';
            if (window.sessionStorage.getItem('hive:confirmed') === '1') return 'hive';
            if (path.indexOf('/join') === 0) return 'hive';
            return window.localStorage.getItem('the-hive-auth') ? 'space' : 'door';
          } catch (err) {
            // Private browsing can throw on the storage itself. Gold is the safe
            // answer: it is what every arrival looked like before today.
            return 'hive';
          }
        }

        var going = headingTo();
        if (going === 'hive') return;

        document.documentElement.setAttribute('data-hive-boot', going);
        // The browser's own furniture — the address bar on a phone, the task
        // switcher card — reads this rather than the CSS.
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', going === 'space' ? '#07080F' : '#33271A');
      })();
    </script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="hive-boot-splash" role="progressbar" aria-label="HIVE is opening">
      <span aria-hidden="true">&#128029;</span>
    </div>
    <div id="root"></div>
    <script>
      // Hand over when there is a PAGE behind this, not when there is a React.
      //
      // The old test was "does #root have any children yet", and it was the
      // strobe. React puts its container in #root long before there is anything
      // worth looking at, and on web each screen's code downloads separately, so
      // for most of a second after that there is genuinely nothing drawn. This
      // splash was letting go into that gap, the root layout drew a second bee
      // into it, and then that one went too.
      //
      // So the app says when. `window.__hiveArrived()` is called by the screens
      // a member is meant to READ — the signed-in shell in app/(app)/_layout.tsx
      // and the sign-in screen in app/(auth)/login.tsx — never by a loading
      // state. app/_layout.tsx also calls it once the app has settled and
      // stopped changing the page, which covers any screen that does not know
      // about this (an invite at /join is the one that matters).
      //
      // If every one of those fails the splash still goes, because a member
      // looking at a bee with a working app underneath it is the worst outcome
      // available.
      (function () {
        var splash = document.getElementById('hive-boot-splash');
        if (!splash) return;

        // A loading screen that lasts a fifth of a second reads as a fault, not
        // as loading. So once this is up it stays up for at least this long,
        // which means a repeat visit off a warm cache gets a moment rather than
        // a flicker.
        var MINIMUM_ON_SCREEN_MS = 420;
        var shownAt = Date.now();

        var leaving = false;
        function leave() {
          if (leaving) return;
          leaving = true;
          // Fade rather than cut. When the colour guess above was right this is
          // invisible — same colour either side. When it was wrong it turns a
          // flash into a dissolve, which is the difference between "janky" and
          // "arriving". 380ms covers the 320ms transition with room to spare.
          splash.classList.add('hive-boot-leaving');
          window.setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 380);
        }

        var booked = false;
        function handOver() {
          if (leaving || booked) return;
          booked = true;
          var waited = Date.now() - shownAt;
          if (waited < MINIMUM_ON_SCREEN_MS) {
            window.setTimeout(leave, MINIMUM_ON_SCREEN_MS - waited);
            return;
          }
          leave();
        }

        window.__hiveArrived = handOver;

        // A last resort, well past any normal start, so a browser where none of
        // the above ever runs cannot strand somebody on the splash.
        window.setTimeout(leave, 20000);
      })();
    </script>
  </body>
</html>
