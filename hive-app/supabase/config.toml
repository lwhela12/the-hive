# =============================================================================
# EDGE FUNCTIONS CONFIGURATION
# =============================================================================
#
# We disable gateway-level JWT verification and handle it in our function code.
# This gives us:
#
# 1. More control over auth logic
# 2. Better error handling and specific error messages
# 3. Avoids gateway caching issues with JWTs
# 4. Follows Supabase's recommended pattern
#
# See: supabase/functions/_shared/auth.ts for the JWT verification implementation
#
# IMPORTANT: All functions that require user authentication should:
# 1. Import { verifySupabaseJwt, isAuthError } from '../_shared/auth.ts'
# 2. Call verifySupabaseJwt(req.headers.get('Authorization'))
# 3. Handle the auth error if present
#
# Functions that use service_role (like notify, transcribe) don't need user auth
# but should still be deployed with verify_jwt = false for consistency.
#
# =============================================================================

# Main chat endpoint - requires user authentication
# Auth handled via _shared/auth.ts using jose library
[functions.chat]
verify_jwt = false

# Send community invites - requires admin authentication
# Auth handled via _shared/auth.ts using jose library
[functions.invite]
verify_jwt = false

# Internal notification system - uses service_role key
# No user auth required (called server-to-server)
[functions.notify]
verify_jwt = false

# AssemblyAI webhook handler - uses service_role key
# No user auth required (called from AssemblyAI webhook)
[functions.transcribe]
verify_jwt = false

# Schedule meetings with Google Meet links - requires user authentication
# Auth handled via _shared/auth.ts using jose library
[functions.schedule-meeting]
verify_jwt = false

# Delete meetings from Google Calendar and database - requires admin authentication
# Auth handled via _shared/auth.ts using jose library
[functions.delete-meeting]
verify_jwt = false

# Update meetings in Google Calendar and database - requires user authentication
# Auth handled via _shared/auth.ts using jose library
[functions.update-meeting]
verify_jwt = false

# DM notification system - uses service_role key
# Sends push notifications for new DM messages
[functions.notify-dm]
verify_jwt = false

# Board reply notification system - uses service_role key
# Sends push notifications when someone replies to a board post
[functions.notify-board-reply]
verify_jwt = false

# Board mention notification system - uses service_role key
# Sends push notifications when someone @mentions a member in a board post or reply
[functions.notify-board-mention]
verify_jwt = false

# Wish mention notification system - uses service_role key
# Sends push notifications when someone @mentions a member in a wish or wish comment
[functions.notify-wish-mention]
verify_jwt = false

# Chat mention notification system - uses service_role key
# Sends push notifications when someone @mentions a member in a community room
[functions.notify-chat-mention]
verify_jwt = false

# Generate conversation titles using Claude Haiku - requires user authentication
# Auth handled via _shared/auth.ts using jose library
[functions.generate-title]
verify_jwt = false

# Create community events from the member-facing HIVE home screen.
# Auth and membership checks are handled in function code.
[functions.create-event]
verify_jwt = false

# Daily meeting reminder - uses service_role key
# Sends push notifications the day before a scheduled meeting
# No user auth required (triggered by cron or manual HTTP call)
#
# Scheduling: Supabase config.toml does not support cron scheduling directly.
# Set up an external cron job (e.g., GitHub Actions, Vercel Cron, or a
# pg_cron job in Supabase SQL) to call this function daily at 9:00 AM:
#
#   curl -X POST https://<project-ref>.supabase.co/functions/v1/meeting-reminder \
#     -H "Content-Type: application/json" \
#     -d '{}'
#
# Example pg_cron (run in Supabase SQL Editor):
#   select cron.schedule(
#     'daily-meeting-reminder',
#     '0 9 * * *',
#     $$
#     select net.http_post(
#       url := 'https://<project-ref>.supabase.co/functions/v1/meeting-reminder',
#       headers := '{"Content-Type": "application/json"}'::jsonb,
#       body := '{}'::jsonb
#     );
#     $$
#   );
[functions.meeting-reminder]
verify_jwt = false

# Cron-triggered: emails + notifies members 3 days before the meeting when the
# monthly check-in opens. Service-role, no user auth.
[functions.check-in-reminder]
verify_jwt = false

# Import Gemini/Google Meet notes into Meeting Hub.
# Auth and membership checks are handled in function code.
[functions.import-meeting-notes]
verify_jwt = false

# Apply imported notes into action items, events, and board posts.
# Auth and membership checks are handled in function code.
[functions.apply-meeting-notes]
verify_jwt = false

# Compose the meeting-day live app activity into a meeting record.
# Auth (member JWT or service key) is handled in function code.
[functions.seal-meeting]
verify_jwt = false

# Creates a Nat-only held preview after an explicit Wrap-Up absence check, then
# sends to confirmed absentees only when an owner separately approves it.
[functions.post-meeting-recap]
verify_jwt = false

# Open (or make) this HIVE's video room and hand back a way in with the
# caller's own name on it. The only place DAILY_API_KEY is ever read.
# Membership is checked as the caller, so RLS decides who gets a room.
[functions.daily-room]
verify_jwt = false

# File a meeting's transcript onto that day's meeting row, so Wrap-Up's seal
# and the transcript land on the same record whichever happens first.
[functions.save-transcript]
verify_jwt = false

# The room's own recording, for a HIVE that meets around one table with nobody
# on the call. Same door as save-transcript: the function verifies the caller
# itself and checks their membership, so the gateway does not.
[functions.save-recording]
verify_jwt = false

# Harvest the cycle (newsletter thread, compliments, helper log, grants,
# check-ins) into the same sections[] shape the meeting summary uses.
# Auth (member JWT or service key) is handled in function code.
[functions.draft-newsletter]
verify_jwt = false

# App Feedback: files a member's note about the app itself, then emails whoever
# runs the HIVE. The only writer to public.app_feedback (that table has no
# insert policy on purpose), so JWT verification in function code is what makes
# the author's name trustworthy.
[functions.app-feedback]
verify_jwt = false

# Sends the newsletter sign-up confirmation, called server-to-server from the
# public site's own subscribe endpoint (no browser ever calls this directly,
# so no user JWT to check). Only sends one fixed template with a looked-up
# unsubscribe token — never arbitrary caller-supplied content.
[functions.subscribe-welcome]
verify_jwt = false

# Sends an issue of The Buzz to the merged member + subscriber list. Owner
# only, checked in function code. The caller may name a post id and nothing
# else — the issue is read from board_posts, so this can never be handed
# arbitrary HTML to mail out.
[functions.send-newsletter]
verify_jwt = false

[functions.library]
verify_jwt = false

[functions.worth-capturing]
verify_jwt = false

# Brings Google Meet's transcript Docs out of Drive and files them onto the
# right HIVE's meeting record. Two ways in, and only two: the cron with the
# service key, or Nat and Lucas signed in — checked in function code, because a
# function that reads Drive and writes into any HIVE cannot be left open.
#
# Needs two things a deploy cannot give it: the HIVE Google token must carry
# drive.readonly (scripts/get-google-token.js asks for calendar.events only), and
# Nat's "Default Folder for Meeting Recordings" must be shared read-only with the
# HIVE Google account. Set MEET_TRANSCRIPTS_FOLDER_ID to that folder to narrow
# the search. Both are spelled out at the top of the function.
[functions.import-meet-transcripts]
verify_jwt = false
